# AeroSpace 配置目标：
# - 使用语义化工作区组织日常任务
# - 保持 i3/Vim 风格方向键操作
# - 和 SketchyBar、borders 组成完整 macOS 桌面体验


# 基础行为
# 即使部分值与默认值一致，也显式保留，方便之后直接调参。
config-version = 2

start-at-login = true

# 保持窗口树结构简洁，避免出现难以理解的嵌套布局。
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

automatically-unhide-macos-hidden-apps = false

# 当前没有 mode 状态提示；保留显式空数组作为以后扩展入口。
on-mode-changed = []


# 桌面联动
# 启动桌面辅助组件。borders 的样式暂时在这里保持内联，便于和 AeroSpace 同步启动。
after-startup-command = [
    'exec-and-forget borders style=round width=6.0 hidpi=off active_color=0xff7aa2f7 inactive_color=0xff1e2030',
    'exec-and-forget sketchybar',
]

# 焦点跨显示器变化时移动鼠标；当前主要是保留默认行为，方便之后接外屏时调整。
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# 通知 SketchyBar 刷新工作区状态。
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

# 通知 SketchyBar 刷新前台应用或焦点相关 widget。
on-focus-changed = [
    'exec-and-forget sketchybar --trigger aerospace_focus_change',
]


# 工作区
# 语义工作区：比纯数字更接近日常任务切换时的心理模型。
persistent-workspaces = ["files", "web", "dev", "net", "game", "chat", "vm"]


# 布局与间距
# 默认使用平铺，accordion 作为按需切换的堆叠布局。
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# 外边距配合 SketchyBar 和 borders；顶部给菜单栏/SketchyBar 留空间。
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       5
    outer.bottom =     3
    outer.top =        38
    outer.right =      5


# 键盘布局
[key-mapping]
    preset = 'qwerty'


# 主模式快捷键
[mode.main.binding]

    # 终端：保留 Alt+Enter 的 i3 习惯，同时提供 Alt+T 作为语义入口。
    alt-t = '''exec-and-forget open -na WezTerm'''
    alt-enter = '''exec-and-forget open -na WezTerm'''

    # 布局切换：tiles 用于并排工作，accordion 用于同类窗口堆叠。
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Vim/tmux 风格方向键。
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # 快速调整当前容器大小。
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # 工作区：字母是主入口，数字 1-7 保留用于兼容旧配置和肌肉记忆。
    alt-f = 'workspace files'
    alt-w = 'workspace web'
    alt-d = 'workspace dev'
    alt-n = 'workspace net'
    alt-g = 'workspace game'
    alt-c = 'workspace chat'
    alt-v = 'workspace vm'

    alt-1 = 'workspace files'
    alt-2 = 'workspace web'
    alt-3 = 'workspace dev'
    alt-4 = 'workspace net'
    alt-5 = 'workspace game'
    alt-6 = 'workspace chat'
    alt-7 = 'workspace vm'

    # 移动窗口后立即切换到目标工作区，保持操作反馈明确。
    alt-shift-f = ['move-node-to-workspace files', 'workspace files']
    alt-shift-w = ['move-node-to-workspace web', 'workspace web']
    alt-shift-d = ['move-node-to-workspace dev', 'workspace dev']
    alt-shift-n = ['move-node-to-workspace net', 'workspace net']
    alt-shift-g = ['move-node-to-workspace game', 'workspace game']
    alt-shift-c = ['move-node-to-workspace chat', 'workspace chat']
    alt-shift-v = ['move-node-to-workspace vm', 'workspace vm']

    alt-shift-1 = ['move-node-to-workspace files', 'workspace files']
    alt-shift-2 = ['move-node-to-workspace web', 'workspace web']
    alt-shift-3 = ['move-node-to-workspace dev', 'workspace dev']
    alt-shift-4 = ['move-node-to-workspace net', 'workspace net']
    alt-shift-5 = ['move-node-to-workspace game', 'workspace game']
    alt-shift-6 = ['move-node-to-workspace chat', 'workspace chat']
    alt-shift-7 = ['move-node-to-workspace vm', 'workspace vm']

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # service mode 放维护类操作，避免常用模式里塞太多危险快捷键。
    alt-shift-semicolon = 'mode service'


# 维护模式快捷键
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']


# 窗口路由规则
# files: 文件管理、系统工具等短任务窗口。
[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = ['layout floating', 'move-node-to-workspace files']

[[on-window-detected]]
    if.app-id = 'com.apple.audio.AudioMIDISetup'
    run = ['layout floating', 'move-node-to-workspace files']


# web: 浏览器窗口默认平铺。
[[on-window-detected]]
    if.app-id = 'org.mozilla.firefox'
    run = ['layout tiles', 'move-node-to-workspace web']


# dev: 编辑器、IDE 和 Java GUI 工具默认堆叠，减少开发工作区横向拥挤。
[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'
    run = ['layout accordion', 'move-node-to-workspace dev']

[[on-window-detected]]
    if.app-id = 'net.java.openjdk.java'
    run = ['layout accordion', 'move-node-to-workspace dev']

[[on-window-detected]]
    if.app-id = 'com.google.android.studio'
    run = ['layout accordion', 'move-node-to-workspace dev']


# net: 网络、代理和组网工具。
[[on-window-detected]]
    if.app-id = 'io.geph.GephGui'
    run = ['layout floating', 'move-node-to-workspace net']

[[on-window-detected]]
    if.app-id = 'com.kkrainbow.easytier'
    run = ['layout floating', 'move-node-to-workspace net']


# game: 游戏启动器和游戏窗口默认堆叠。
[[on-window-detected]]
    if.app-id = 'sh.ppy.osu.lazer'
    run = ['layout accordion', 'move-node-to-workspace game']


# chat: 聊天工具集中放置。
[[on-window-detected]]
    if.app-id = 'com.tencent.xinWeChat'
    run = ['layout accordion', 'move-node-to-workspace chat']


# vm: 虚拟机和远程桌面。
[[on-window-detected]]
    if.app-id = 'com.parallels.desktop.console'
    run = ['layout accordion', 'move-node-to-workspace vm']

[[on-window-detected]]
    if.app-id = 'com.carriez.rustdesk'
    run = ['layout accordion', 'move-node-to-workspace vm']

[[on-window-detected]]
    if.app-id = 'com.youqu.todesk.mac'
    run = ['layout accordion', 'move-node-to-workspace vm']


# 上下文窗口，不参与窗口路由规则。
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = ['layout floating']

[[on-window-detected]]
    if.app-id = 'org.keepassxc.keepassxc'
    run = ['layout floating']


# 兜底规则
[[on-window-detected]]
    if.app-name-regex-substring = '[Bb]rowser'
    run = ['layout tiles', 'move-node-to-workspace web']

[[on-window-detected]]
    if.app-name-regex-substring = '([Pp]roxy|[Vv][Pp][Nn])'
    run = ['layout floating', 'move-node-to-workspace net']

[[on-window-detected]]
    if.app-name-regex-substring = '([Ss]team|[Gg]ame)'
    run = ['layout accordion', 'move-node-to-workspace game']

[[on-window-detected]]
    if.app-name-regex-substring = '([Cc]hat|[Mm]essenger|[Mm]essage|[Mm]eeting|[Cc]onference)'
    run = ['layout accordion', 'move-node-to-workspace chat']

[[on-window-detected]]
    if.app-name-regex-substring = '([Vv]m[Ww]are|[Rr]emote|[Pp]arallel|[Vv]irtual)'
    run = ['layout accordion', 'move-node-to-workspace vm']

[[on-window-detected]]
    if.window-title-regex-substring = '(settings|preferences|options|about|properties|设置|偏好|选项|关于|属性)'
    run = 'layout floating'
