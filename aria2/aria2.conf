dir=${HOME}/Downloads/aria2
continue=true

# 下载目录（默认 ${HOME}/Downloads/aria2；个别机器如 Termux 由本机 locals 覆盖）
# @locals:download-dir.conf

# 重试相关
max-tries=20
retry-wait=5
connect-timeout=30
timeout=30
max-file-not-found=3

# 并发 / 分片
disk-cache=64M
max-concurrent-downloads=3
split=4
max-connection-per-server=4

# 日志
log-level=notice

# RPC 配置（rpc-secret 由 locals 注入，缺失时不写入并告警）
enable-rpc=true
# @locals:rpc-secret.conf
rpc-listen-port=6800
rpc-listen-all=true
rpc-allow-origin-all=false

# session 配置（link 阶段预创建 ~/.local/state/aria2，跨平台统一）
save-session=${HOME}/.local/state/aria2/aria2.session
input-file=${HOME}/.local/state/aria2/aria2.session
save-session-interval=60
